<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-List</title>
  </head>
  <body>
    <div class="web-page-container">
      <div class="sidebar">
        <div class="website-name">
          <img src="logo-img.jpg" alt="website-logo" />
          <h1>Todo List</h1>
        </div>
        <div class="add-task-button">
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>Add Tasks</title>
              <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
            <span>Add Task</span>
          </button>
        </div>
        <div class="inbox-and-utility-section">
          <button class="inbox-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>Inbox</title>
              <path
                d="M19,15H15A3,3 0 0,1 12,18A3,3 0 0,1 9,15H5V5H19M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"
              />
            </svg>
            <span>Inbox</span>
          </button>
          <button class="today-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>Calendar Today</title>
              <path
                d="M7,10H12V15H7M19,19H5V8H19M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"
              />
            </svg>
            <span>Today</span>
          </button>
          <button class="upcoming-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>Upcoming Tasks</title>
              <path
                d="M19 3H18V1H16V3H8V1H6V3H5C3.9 3 3 3.9 3 5V19C3 20.11 3.9 21 5 21H19C20.11 21 21 20.11 21 19V5C21 3.9 20.11 3 19 3M19 19H5V9H19V19M5 7V5H19V7H5M7 11H17V13H7V11M7 15H14V17H7V15Z"
              />
            </svg>
            <span>Upcoming</span>
          </button>
        </div>
        <div class="my-projects-section">
          <button class="my-projects-heading">
            <h3>My Projects</h3>
            <span class="add-project-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>Add Projects</title>
                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
              </svg>
            </span>
          </button>
          <div class="list-of-projects"></div>
        </div>
      </div>
      <div class="main-content">
        <div class="todo-item-form-container">
          <dialog id="create-new-project-dialog">
            <form class="create-new-project-form">
              <label for="project-name">Project Name</label>
              <input type="text" name="project-name" id="project-name" />
              <button class="create-new-project-submit-btn" formmethod="dialog">
                Submit
              </button>
              <button
                type="button"
                commandfor="create-new-project-dialog"
                command="close"
              >
                Close
              </button>
            </form>
          </dialog>

          <dialog id="todo-item-edit-dialog">
            <form class="todo-item-edit-form">
              <label for="title">Title</label>
              <input
                class="todo-item-title-on-edit-form"
                type="text"
                name="title"
                id="title"
              />

              <label for="description">Description</label>
              <input
                class="todo-item-desciption-on-edit-form"
                type="text"
                name="description"
                id="description"
              />

              <label for="project-list">Project</label>
              <select
                class="project-list-on-edit-form"
                name="project-list"
                id="project-list"
              ></select>

              <label for="date">Date</label>
              <input
                type="date"
                class="date-on-edit-form"
                name="date"
                id="date"
              />

              <label for="priority-list">Priority</label>
              <select
                class="priority-list-on-edit-form"
                name="priority-list"
                id="priority-list"
              >
                <option value="p1">p1</option>
                <option value="p2">p2</option>
                <option value="p3">p3</option>
              </select>

              <button class="edit-form-submit-btn" formmethod="dialog">
                Submit
              </button>

              <button
                type="button"
                commandfor="todo-item-edit-dialog"
                command="close"
              >
                Close
              </button>
            </form>
          </dialog>

          <form class="todo-item-collection-form">
            <div class="first-half-of-form">
              <input
                class="text-area-to-enter-todo-item"
                type="text"
                name="todo-item"
                id="todo-item"
                placeholder="Type your task here"
                required
                autofocus
              />
            </div>
            <div class="second-half-of-form">
              <div>
                <select
                  name="project"
                  id="project"
                  class="list-of-projects-on-todo-form-collection"
                >
                  <option class="inbox-option" value="inbox">Inbox</option>
                </select>
                <input
                  class="date"
                  type="date"
                  id="todo-item-due-date"
                  name="todo-item-due-date"
                />
                <select name="priority" id="priority">
                  <option checked value="priority">priority</option>
                  <option value="p1">p1</option>
                  <option value="p2">p2</option>
                  <option value="p3">p3</option>
                </select>
                <button type="button" class="description-btn">
                  Description
                </button>
              </div>
              <div>
                <button class="submitBtn" type="submit">Submit</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
